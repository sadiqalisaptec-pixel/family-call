<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Link - Direct Call</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .screen { flex: 1; display: none; flex-direction: column; padding: 20px; height: 100%; }
        .active { display: flex; }
        
        /* Login & Contacts */
        .container { max-width: 400px; margin: 20px auto; width: 100%; background: #1e293b; padding: 24px; border-radius: 16px; border: 1px solid #334155; }
        h1, h2 { color: #38bdf8; margin-bottom: 15px; text-align: center; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-bottom: 15px; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #0284c7; color: #fff; font-weight: bold; cursor: pointer; }
        
        .user-list { list-style: none; margin-top: 15px; }
        .user-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #334155; border-radius: 8px; margin-bottom: 10px; }
        .online-dot { height: 10px; width: 10px; background-color: #10b981; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .call-btn { background: #10b981; width: auto; padding: 8px 16px; margin: 0; }

        /* Incoming Call Alert */
        #incoming-alert { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; border: 2px solid #10b981; padding: 20px; border-radius: 12px; z-index: 1000; text-align: center; width: 90%; max-width: 350px;}
        .alert-btns { display: flex; gap: 10px; margin-top: 15px; }
        .btn-accept { background: #10b981; flex: 1;}
        .btn-reject { background: #ef4444; flex: 1;}

        /* Video Screen */
        #video-container { position: relative; flex: 1; background: #000; border-radius: 16px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
        #localVideo { position: absolute; bottom: 16px; right: 16px; width: 100px; height: 140px; object-fit: cover; border-radius: 12px; border: 2px solid #38bdf8; }
        .call-controls { display: flex; justify-content: center; gap: 20px; padding: 16px 0; }
        .btn-control { width: 58px; height: 58px; border-radius: 50%; border: none; font-size: 22px; cursor: pointer; }
        .btn-hangup { background: #ef4444; color: white; }
    </style>
</head>
<body>

    <!-- SCREEN 1: LOGIN -->
    <div id="login-screen" class="screen active">
        <div class="container">
            <h1>Join Family Link</h1>
            <input type="text" id="usernameInput" placeholder="Enter your name (e.g., Sadiq)">
            <button onclick="login()">Enter</button>
        </div>
    </div>

    <!-- SCREEN 2: CONTACTS -->
    <div id="contacts-screen" class="screen">
        <div class="container">
            <h2>Online Family</h2>
            <div style="text-align:center; color:#10b981; margin-bottom:15px;" id="my-name-display"></div>
            <ul class="user-list" id="usersList">
                <!-- Users will populate here -->
            </ul>
        </div>
    </div>

    <!-- INCOMING CALL ALERT -->
    <div id="incoming-alert">
        <h3 style="color:white; margin-bottom: 5px;">Incoming Call</h3>
        <p style="color:#94a3b8;" id="caller-name">Someone is calling...</p>
        <div class="alert-btns">
            <button class="btn-reject" onclick="rejectCall()">Decline</button>
            <button class="btn-accept" onclick="acceptCall()">Answer</button>
        </div>
    </div>

    <!-- SCREEN 3: VIDEO CALL -->
    <div id="call-screen" class="screen">
        <h3 id="callStatus" style="text-align:center; color:#38bdf8; margin-bottom:10px;">Connecting...</h3>
        <div id="video-container">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <div class="call-controls">
            <button class="btn-control btn-hangup" onclick="endCall()">📞</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDoc, onSnapshot, updateDoc, deleteDoc, serverTimestamp, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // PASTE YOUR KEYS HERE (From Previous Steps)
        // ==========================================
        const firebaseConfig = {
          apiKey: "AIzaSyCeGrH0Y_uWJQgkEqSZCme3jzRQooc_jU4",
          authDomain: "dubai-family-call.firebaseapp.com",
          projectId: "dubai-family-call",
          storageBucket: "dubai-family-call.firebasestorage.app",
          messagingSenderId: "907162619235",
          appId: "1:907162619235:web:0527ae164861e2e8cd5756",
          measurementId: "G-BV91TFC8W1"
        };
        
      const turnConfig = {
            iceServers: [
                {
                    urls: "turns:standard.relay.metered.ca:443?transport=tcp",
                    username: "2dab1921791bc88ce1916faa",
                    credential: "iT9lOZ5XXZ1yoLpt"
                }
            ],
            iceTransportPolicy: "relay"
        };
        const turnConfig = {
            // YOUR METERED TURN CONFIG HERE
            iceServers: [ { urls: "stun:stun.l.google.com:19302" } ] 
        };

        const app = initializeApp(firebaseConfig);
        
        const db = getFirestore(app);

        let currentUser = null;
        let pc;
        let localStream;
        let currentCallId = null;
        let presenceInterval;

        // 1. LOGIN & PRESENCE
        window.login = async () => {
            const name = document.getElementById("usernameInput").value.trim();
            if (!name) return alert("Please enter your name");
            
            currentUser = name.toLowerCase();
            document.getElementById("my-name-display").innerHTML = `<span class="online-dot"></span> Logged in as: <b>${name}</b>`;
            
            document.getElementById("login-screen").classList.remove("active");
            document.getElementById("contacts-screen").classList.add("active");

            // Update Presence in Firebase every 10 seconds
            const userRef = doc(db, "users", currentUser);
            const updatePresence = () => setDoc(userRef, { name: name, lastSeen: serverTimestamp(), isOnline: true }, { merge: true });
            
            await updatePresence();
            presenceInterval = setInterval(updatePresence, 10000); // Heartbeat

            listenForUsers();
            listenForIncomingCalls();
        };

        // 2. LISTEN FOR ONLINE USERS
        function listenForUsers() {
            const usersRef = collection(db, "users");
            // Simple query: Get everyone marked online
            const q = query(usersRef, where("isOnline", "==", true));
            
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById("usersList");
                list.innerHTML = "";
                
                snapshot.forEach((doc) => {
                    const user = doc.data();
                    if (doc.id !== currentUser) { // Don't show myself
                        list.innerHTML += `
                            <li class="user-item">
                                <div><span class="online-dot"></span>${user.name}</div>
                                <button class="call-btn" onclick="initiateCall('${doc.id}')">Call</button>
                            </li>
                        `;
                    }
                });
            });
        }

        // 3. LISTEN FOR INCOMING CALLS
        function listenForIncomingCalls() {
            const myUserRef = doc(db, "users", currentUser);
            onSnapshot(myUserRef, (docSnap) => {
                const data = docSnap.data();
                if (data && data.incomingCall) {
                    currentCallId = data.incomingCall.callId;
                    document.getElementById("caller-name").innerText = `${data.incomingCall.callerName} is calling...`;
                    document.getElementById("incoming-alert").style.display = "block";
                } else {
                    document.getElementById("incoming-alert").style.display = "none";
                }
            });
        }

        // 4. INITIATE CALL (Caller)
        window.initiateCall = async (targetUserId) => {
            currentCallId = `${currentUser}_${targetUserId}_${Date.now()}`;

            // --- NEW: TELEGRAM PUSH NOTIFICATION CODE ---
          /*const telegramToken = "PASTE_YOUR_BOT_TOKEN_HERE";
           const cousinChatId = "PASTE_YOUR_COUSINS_CHAT_ID_HERE";
           const appLink = "https://sadiqalisaptec-pixel.github.io/family-call/"; // Your GitHub link
    
    fetch(`https://api.telegram.org/bot${telegramToken}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            chat_id: cousinChatId,
            text: `☎️ Incoming Video Call from ${currentUser}!`,
            reply_markup: {
                inline_keyboard: [[{ text: "📱 Tap to Answer", url: appLink }]]
            }
        })
    }).catch(err => console.log("Push failed", err));  */
    // --------------------------------------------
            
            document.getElementById("contacts-screen").classList.remove("active");
            document.getElementById("call-screen").classList.add("active");
            document.getElementById("callStatus").innerText = `Calling ${targetUserId}...`;

            await getMedia();
            pc = new RTCPeerConnection(turnConfig);
            localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
            
            pc.ontrack = e => document.getElementById("remoteVideo").srcObject = e.streams[0];

            const callDocRef = doc(db, "calls", currentCallId);
            await setDoc(callDocRef, { caller: currentUser, receiver: targetUserId });

            // Send Ice Candidates
            pc.onicecandidate = e => {
                if(e.candidate) setDoc(collection(callDocRef, "callerCandidates"), e.candidate.toJSON());
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            await updateDoc(callDocRef, { offer: { type: offer.type, sdp: offer.sdp } });

            // Notify Receiver
            await updateDoc(doc(db, "users", targetUserId), {
                incomingCall: { callId: currentCallId, callerName: currentUser }
            });

            // Listen for Answer
            onSnapshot(callDocRef, async snapshot => {
                const data = snapshot.data();
                if (data && data.answer && !pc.currentRemoteDescription) {
                    await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
                    document.getElementById("callStatus").innerText = "Connected Securely";
                }
            });
        };

        // 5. ACCEPT CALL (Receiver)
        window.acceptCall = async () => {
            document.getElementById("incoming-alert").style.display = "none";
            document.getElementById("contacts-screen").classList.remove("active");
            document.getElementById("call-screen").classList.add("active");
            
            await getMedia();
            pc = new RTCPeerConnection(turnConfig);
            localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
            pc.ontrack = e => document.getElementById("remoteVideo").srcObject = e.streams[0];

            const callDocRef = doc(db, "calls", currentCallId);
            const callData = (await getDoc(callDocRef)).data();

            pc.onicecandidate = e => {
                if(e.candidate) setDoc(collection(callDocRef, "receiverCandidates"), e.candidate.toJSON());
            };

            await pc.setRemoteDescription(new RTCSessionDescription(callData.offer));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            
            await updateDoc(callDocRef, { answer: { type: answer.type, sdp: answer.sdp } });

            // Clear incoming call flag
            await updateDoc(doc(db, "users", currentUser), { incomingCall: null });
            document.getElementById("callStatus").innerText = "Connected Securely";
        };

        window.rejectCall = async () => {
            await updateDoc(doc(db, "users", currentUser), { incomingCall: null });
            document.getElementById("incoming-alert").style.display = "none";
        };

        window.endCall = async () => {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (pc) pc.close();
            if (currentCallId) await deleteDoc(doc(db, "calls", currentCallId));
            window.location.reload();
        };

        async function getMedia() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById("localVideo").srcObject = localStream;
            } catch (e) {
                alert("Camera access denied");
            }
        }
    </script>
</body>
</html>
